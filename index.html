  .tile .mini img{height:58px;image-rendering:pixelated} .tile .mini img.flip{transform:scaleX(-1)} .tile .mini img.dim{opacity:.45}
  .tile .txt{font-size:13px;line-height:1.35} .tile .tag{display:block;font-size:11px;opacity:.75}
  .poster{background:#fff8ec;color:#4a2f1b;border:4px double #b8862b;border-radius:16px;padding:14px 16px}
  .poster .champ{display:flex;gap:12px;align-items:center;border-bottom:2px dashed #d9b46a;padding-bottom:10px;margin-bottom:8px}
  .poster .champ img{height:86px;image-rendering:pixelated} .poster .champ b{font-size:20px} .poster .champ p{margin:4px 0 0;font-size:14px;line-height:1.5}
  .poster .mm{height:36px;width:36px;border-radius:8px;border:2px solid #b8862b;vertical-align:middle;margin-right:5px}
  .poster ol{margin:0;padding-left:22px;font-size:14px;line-height:1.7} .poster .last{font-size:12px;opacity:.75;margin:8px 0 0}
  @media (max-width:560px){#tiles{gap:6px}.tile{padding:6px 4px;min-height:118px}.tile .txt{font-size:11.5px}.tile .mini img{height:44px}.tile .mini{height:50px}}
  svg{display:block;width:100%;height:auto;max-height:calc(100vh - 60px)}
  svg.zoomed{max-height:none}
  svg text{font-family:inherit;fill:#5b4636}
  .ink{stroke:#5b4636;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
  .c{cursor:pointer}
  .c.wait .wl,.c.wait .wr{animation-play-state:paused}  /* 停下來讓路時腳也停 */
  .c:focus{outline:none}.c:focus .name{text-decoration:underline}
  .head{transform-origin:0 -40px;transition:transform .6s}
  .hud{transition:transform .6s}
  .off{opacity:0;pointer-events:none}
  @keyframes bob{50%{transform:translateY(-3px)}}
  @keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
  @keyframes pace{from{transform:translateX(-28px)}to{transform:translateX(28px)}}
  @keyframes pound{0%,60%{transform:translateY(-22px)}75%{transform:translateY(0)}}
  @keyframes drip{from{transform:translateY(0);opacity:1}to{transform:translateY(22px);opacity:0}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes float{from{transform:translateY(0);opacity:1}to{transform:translateY(-22px);opacity:0}}
  .easy .head,.boss .head{animation:bob 1.6s infinite}
  .idle .pose{animation:bob 3s infinite}
  .idle.lie .pose{animation:none;transform:rotate(-63deg)}
  .idle.half .pose{animation:none;transform:rotate(-28deg)}
  .idle.flat .pose{animation:none;transform:rotate(82deg)}
  .flat .hud{transform:translate(48px,80px)}
  @keyframes waddle{0%,100%{transform:rotate(-7deg) translateY(0)}25%,75%{transform:translateY(-7px)}50%{transform:rotate(7deg) translateY(0)}}
  .c.walk .pose{animation:waddle .42s linear infinite;opacity:1}
  .lie .hud{transform:translate(-56px,40px)}
  @keyframes tv{0%{fill:#7fb2e5}33%{fill:#ffd98a}66%{fill:#ff9aa2}100%{fill:#9cc5a1}}
  .tv{animation:tv 2.4s steps(1) infinite}
  .hard .pose{filter:saturate(.5)}
  .hard .head{transform:translateY(10px) rotate(9deg)}
  .slump .head{transform:translateY(18px) rotate(14deg)}
  .rage .pose,.pound .pose{animation:shake .25s infinite}
  .pound .fist{animation:pound .5s infinite}
  .seek .pose{animation:pace 1.6s ease-in-out infinite alternate}
  @keyframes ghost{0%,100%{transform:translateY(-30px)}50%{transform:translateY(-40px)}}
  .ghost .pose{opacity:.5;animation:ghost 3s ease-in-out infinite}
  .ghost .hud{transform:translateY(-34px)}
  .ko .pose{transform:rotate(90deg)}
  .ko .hud{transform:translate(48px,80px)}
  .sweat{animation:drip 1.1s infinite}
  .stars{transform-origin:0 -100px;animation:spin 2s linear infinite}
  .note{animation:float 2s infinite}
  .cheer .spr{animation:hop .5s ease-in-out infinite alternate}
  .tap{animation:tap .32s steps(1) infinite} .tap.b{animation-delay:-.16s} .tap.slow{animation-duration:1.1s} .tap.b.slow{animation-delay:-.55s}
  @keyframes tap{0%,49%{transform:translateY(0)}50%,100%{transform:translateY(-2.2px)}}
  .wait .tap,.walk .tap{animation:none}
  @keyframes hop{to{transform:translateY(-8px)}}
  .px .hud{transform:none!important}
  .wl,.wr{display:none}
  .c:not(.up) .bk{display:none!important}  /* 背面走路圖只在往畫面上方走時出現 */
  .c.up:has(.bk) .wl:not(.bk),.c.up:has(.bk) .wr:not(.bk){display:none!important}
  /* 兩張走路圖輪流出現，每一步身體左右晃、往上頓一下：兩張圖的腳差很少，光換圖看不出在走 */
  @keyframes stepA{0%{opacity:1;transform:rotate(-6deg)}24%{opacity:1;transform:translateY(-6px)}49%{opacity:1;transform:rotate(6deg)}50%,100%{opacity:0}}
  @keyframes stepB{0%,49%{opacity:0}50%{opacity:1;transform:rotate(6deg)}74%{opacity:1;transform:translateY(-6px)}100%{opacity:1;transform:rotate(-6deg)}}
  .wl,.wr{transform-box:fill-box;transform-origin:50% 100%}
  .walk .still{display:none}
  .walk .wl{display:inline;animation:stepA .5s linear infinite}
  .walk .wr{display:inline;animation:stepB .5s linear infinite}
  .easy .spr,.boss .spr{animation:bob 1.8s infinite}
  .idle .spr{animation:bob 3.2s infinite}
  .rage .spr,.pound .spr{animation:shake .25s infinite}
  /* 找人時來回踱步：真的用走路的兩格腳步走過去再轉身走回來，不是整隻左右飄（設計者 2026-11-13） */
  .pace:not(.walk) .spr{animation:pacewalk 4.4s linear infinite}
  @keyframes pacewalk{0%{transform:translateX(-26px) scaleX(1)}46%{transform:translateX(26px) scaleX(1)}50%{transform:translateX(26px) scaleX(-1)}96%{transform:translateX(-26px) scaleX(-1)}100%{transform:translateX(-26px) scaleX(1)}}
  .pace:not(.walk) .still{display:none}
  .pace:not(.walk) .wl{display:inline;animation:stepA .5s linear infinite}
  .pace:not(.walk) .wr{display:inline;animation:stepB .5s linear infinite}
  .ghost .spr{opacity:.72;animation:ghost 3s ease-in-out infinite}
  .ghost .spr image{clip-path:inset(0 0 42% 0)}
  .c.walk .spr{animation:none;opacity:1}
  .c.faceL:not(.walk):not(.pace) .spr:not(:has(clipPath)){transform:scaleX(-1);animation:none}  /* 談公事時面向對方。要關掉休息時的上下浮動動畫，不然兩個變形互相覆蓋，身體會被壓扁又彈開 */
  .c.walk.left .spr{transform:scaleX(-1)}  /* 角色圖預設面向右，往左走時轉身 */
  .c.walk .spr image{clip-path:none}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
